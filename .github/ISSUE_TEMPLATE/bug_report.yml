name: Bug report
description: Report a reproducible problem in mdfier.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private page content, account data, or clipboard text.
  - type: input
    id: version
    attributes:
      label: mdfier version
      placeholder: 0.4.2
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
